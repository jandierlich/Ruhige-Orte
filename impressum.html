<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<title>Impressum – Ruhige Orte</title>
<meta name="theme-color" content="#2C5049">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg1:#F3F0E8;--bg2:#E7DFCE;--card:#ffffffF2;--cardB:#D9D0BB;--primary:#3C6E62;--accent:#2C5049;--gold:#B48A3F;--text:#20302B;--text2:#4B5A54;--muted:#8A9791;--shadow:0 1px 2px rgba(32,48,43,.05),0 10px 28px rgba(32,48,43,.10)}
html.dark{--bg1:#121B18;--bg2:#0C1412;--card:#1D2C27E6;--cardB:rgba(190,205,197,.16);--primary:#5B9284;--accent:#4C8577;--gold:#C9A458;--text:#EDF1EE;--text2:#B7C4BE;--muted:#7E8D87;--shadow:0 12px 32px rgba(0,0,0,.45),0 3px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);min-height:100dvh;padding:10px 16px 60px;padding-top:calc(10px + env(safe-area-inset-top))}
.wrap{max-width:440px;margin:0 auto}
a.back{display:inline-block;margin:14px 0;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--cardB);border-radius:18px;padding:20px;margin:12px 0;box-shadow:var(--shadow);line-height:1.55}
h1{font-size:23px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:18px 0 6px;color:var(--text2)}
.small{font-size:12px;color:var(--muted)}
p{margin:6px 0}
#statusbarCover{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg1);z-index:9000;pointer-events:none}
</style>
</head>
<body>
