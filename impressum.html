<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<title>Impressum – Ruhige Orte</title>
<meta name="theme-color" content="#6BA3D0">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg1:#EDF4FB;--bg2:#D9E9F7;--card:#ffffffF2;--cardB:#B8D4EA;--primary:#6BA3D0;--accent:#4A8BBF;--text:#1A365D;--text2:#2D4A6B;--muted:#8AA6C1;--shadow:0 4px 6px rgba(26,54,93,.07),0 20px 50px rgba(26,54,93,.12)}
html.dark{--bg1:#0B1A2E;--bg2:#132A4A;--card:#1B3150E6;--cardB:rgba(107,163,208,.18);--text:#EAF4FF;--text2:#A9C5E0;--muted:#7AA0C5;--shadow:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);min-height:100dvh;padding:10px 16px 60px;padding-top:calc(10px + env(safe-area-inset-top))}
.wrap{max-width:440px;margin:0 auto}
a.back{display:inline-block;margin:14px 0;color:var(--accent);text-decoration:none;font-weight:700;font-size:14px}
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--cardB);border-radius:28px;padding:20px;margin:12px 0;box-shadow:var(--shadow);line-height:1.55}
h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:18px 0 6px;color:var(--text2)}
.small{font-size:12px;color:var(--muted)}
p{margin:6px 0}
#statusbarCover{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg1);z-index:9000;pointer-events:none}
</style>
</head>
<body>
<div id="statusbarCover"></div>
<div class="wrap">
<a class="back" href="index.html">← Zurück zu Ruhige Orte</a>

<h2>Verantwortlich für den Inhalt nach § 55 Abs. 2 RStV</h2>
<p>Jan Dierlich, Anschrift wie oben</p>
</div>
</div>
</body>
</html>
